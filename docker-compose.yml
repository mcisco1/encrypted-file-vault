services:
  vault:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - vault_data:/app/storage
      - vault_db:/app
    environment:
      - VAULT_SECRET_KEY=${VAULT_SECRET_KEY:-}
      - FLASK_DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vault_data:
  vault_db:
